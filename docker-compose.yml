version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopcloud-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./shopcloud.db
      - PROJECT_NAME=ShopCloud Observability
    volumes:
      - ./backend/shopcloud.db:/app/shopcloud.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopcloud-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
